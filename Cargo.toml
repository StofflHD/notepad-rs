[package]
name = "notepad-rs"
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Notepad++-style text editor for Linux"
authors = ["© StofflHD and Claude"]
license = "GPL-3.0-or-later"
repository = "https://github.com/StofflHD/notepad-rs"

[dependencies]
# Pinned: the egui API changes between releases.
eframe = { version = "=0.29.1", features = ["persistence"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "plist-load", "yaml-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
rfd = "0.17"
encoding_rs = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chardetng = "1"
quick-xml = "0.37"
similar = "2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
walkdir = "2"
globset = "0.4"
rand = "0.8"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
