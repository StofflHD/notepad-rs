name: AppImage

# Tests and builds the AppImage (for glibc >= 2.31) on every push and pull request, and
# publishes it with its .sha256 file (needed by the built-in updater) for tags like v0.2.0.
# The message of an annotated tag becomes the release notes.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GLIBC: "2.31"

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb imagemagick libgl1-mesa-dri libegl1 libxkbcommon-x11-0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install zig and cargo-zigbuild (target glibc ${{ env.GLIBC }})
        run: pip install ziglang==0.16.0 cargo-zigbuild==0.23.4

      - name: Tests
        run: cargo test --locked

      - name: Build AppImage
        run: ZIGBUILD=1 bash packaging/build-appimage.sh

      - name: Check glibc requirement and checksum
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/notepad-rs
          NEED=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol: $NEED"
          test "$(printf '%s\n%s\n' "$NEED" "$GLIBC" | sort -V | tail -1)" = "$GLIBC"
          cd dist && cat ./*.sha256 && sha256sum -c ./*.sha256

      - name: Smoke test (Xvfb)
        run: |
          APP=$(ls dist/NotepadRS-*-x86_64.AppImage)
          "$APP" --appimage-extract > /dev/null
          ldd squashfs-root/usr/bin/notepad-rs | tee ldd.txt
          if grep "not found" ldd.txt; then echo "unresolved libraries" >&2; exit 1; fi
          mkdir -p gui
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          export DISPLAY=:99 NRS_NO_UPDATE=1 LIBGL_ALWAYS_SOFTWARE=1 HOME="$(mktemp -d)"
          squashfs-root/AppRun "$GITHUB_WORKSPACE/src/main.rs" > gui/app.log 2>&1 &
          PID=$!
          sleep 10
          kill -0 $PID || { cat gui/app.log; exit 1; }
          import -window root gui/1-start.png
          kill $PID

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-test
          path: gui/

      - uses: actions/upload-artifact@v4
        with:
          name: NotepadRS-AppImage
          path: |
            dist/NotepadRS-*-x86_64.AppImage
            dist/NotepadRS-*-x86_64.AppImage.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$VERSION"
          SUM=$(cut -d' ' -f1 dist/*.sha256)
          # The checkout may turn an annotated tag into a lightweight one: fetch the tag object.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            # Without the subject line (e.g. "NotepadRS 0.2.0") and any signature.
            NOTES=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          fi
          {
            [ -n "$NOTES" ] && printf '%s\n\n' "$NOTES"
            cat <<EOF
          ## Update

          NotepadRS 0.1.1 and newer updates itself: *? → Update NotepadRS* (or the automatic check at startup).

          ## Installation

          \`\`\`bash
          chmod +x NotepadRS-$VERSION-x86_64.AppImage
          ./NotepadRS-$VERSION-x86_64.AppImage
          \`\`\`

          Runs on x86_64 systems with glibc ≥ $GLIBC (e.g. Ubuntu 20.04, Debian 11, Fedora 32 and newer).

          SHA-256: \`$SUM\`

          See the [README](https://github.com/StofflHD/notepad-rs/blob/notepad-rs/README.md) for all features.
          EOF
          } > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/NotepadRS-*-x86_64.AppImage dist/NotepadRS-*-x86_64.AppImage.sha256 \
            --title "NotepadRS $VERSION" \
            --prerelease \
            --notes-file notes.md
